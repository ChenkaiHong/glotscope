name: CI

on:
  pull_request:
  push:
    branches:
      - foundation

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Create environment
        run: uv venv --python "${{ matrix.python-version }}"

      - name: Install project and development tools
        run: uv pip install --editable ".[dev]"

      - name: Lint
        run: uv run --no-sync ruff check python/glotscope tests

      - name: Check formatting
        run: uv run --no-sync ruff format --check python/glotscope tests

      - name: Typecheck
        run: uv run --no-sync mypy --strict python/glotscope tests

      - name: Test with coverage
        run: uv run --no-sync pytest --cov=glotscope --cov-report=term-missing -q

      # G4: every result carries a manifest, and verify regenerates its numbers
      # bit-identically. Run on all twelve cells rather than once, because the
      # claim worth making is that a published number reproduces on a different
      # OS and a different Python — not that it reproduces where it was made.
      # The fixture is four invented sentences under verification/, carried so
      # this job has something to regenerate without shipping a corpus (D12).
      - name: Verify the committed result reproduces
        run: >
          uv run --no-sync glotscope verify verification/result.json
          --tokenizer verification/tokenizer.json
          --corpus-root verification/corpus
