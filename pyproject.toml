[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# Layout note (PRD §13): the package lives at python/glotscope/ because that is
# the maturin mixed layout v2 commits to (`python-source = "python"`,
# `module-name = "glotscope._core"`). Adopting it now means the v2 switch is a
# build-backend change, not a directory move.

[project]
name = "glotscope"
version = "0.1.0"
description = "Multilingual tokenizer diagnostics with integrated under-trained-token detection"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kai Hong" }]
keywords = ["tokenizer", "multilingual", "nlp", "evaluation", "tokenization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# The core install is Tier 0 + Tier 1 and nothing else. G1 promises a clean
# install across twelve platform cells, so this list is load-bearing: every entry
# is a tree the user resolves before a single metric runs. Anything one tier
# alone imports belongs in that tier's extra.
dependencies = [
    "tokenizers>=0.23",
]

[project.urls]
Homepage = "https://pypi.org/project/glotscope/"
Repository = "https://github.com/ChenkaiHong/glotscope"
Issues = "https://github.com/ChenkaiHong/glotscope/issues"

# All segmenters are optional (PRD §10.3). MeCab needs a native build and a
# dictionary; PyICU needs system ICU. G1 promises green Windows CI for the core
# install only — segmenter-dependent tests skip-with-message.
[project.optional-dependencies]
segmenters = [
    "stanza>=1.10",
    "ufal.udpipe>=1.3",
    "fugashi>=1.3",
    "unidic-lite>=1.0",
    "jieba>=0.42",
    "pythainlp>=5.0",
    "khmer-nltk>=1.6",
    "PyICU>=2.13",
]
# Tier 2 reads E_in/E_out out of safetensors shards and works on them as arrays.
# Neither is imported anywhere at Tier 0 or Tier 1, so neither belongs in a core
# install that promises to be Tier 0 + Tier 1.
tier2 = [
    "safetensors>=0.4",
    "numpy>=1.24,<2.5",
    # Declared rather than inherited. `tokenizers` pulls huggingface_hub in
    # transitively today, so `from_checkpoint` would appear to work on a machine
    # that never asked for it and break on the first resolver that does not —
    # the failure G1's clean-install promise exists to catch, arriving as a bare
    # ModuleNotFoundError at Tier 2 rather than at install time.
    "huggingface_hub>=0.34",
]
# tiktoken encodings are one of the three §8.1 entry points, and the only one
# that needs a second tokenizer library.
tiktoken = [
    "tiktoken>=0.7",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
    "twine==7.0.0",
    # The extras above, because the test suite and mypy --strict cover every
    # tier: a dev install that could not type-check embeddings.py would make the
    # split above invisible to CI.
    "safetensors>=0.4",
    "numpy>=1.24,<2.5",
    "huggingface_hub>=0.34",
    "tiktoken>=0.7",
]

[project.scripts]
glotscope = "glotscope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/glotscope"]

# The sdist ships the package, its tests and its public docs — nothing else.
# glotscope-PRD.md and HISTORY.md are internal working documents and stay out of every
# distribution. A published sdist cannot be retracted, so `include` is an allowlist and
# `exclude` is a second guard. Re-run a leak check after any packaging change.
[tool.hatch.build.targets.sdist]
include = [
    "python/glotscope/**",
    "tests/**",
    "scripts/**",
    "docs/build-order.md",
    "docs/divergences.md",
    "docs/m0-source-audit.md",
    "LICENSE",
    "README.md",
]
exclude = ["glotscope-PRD.md", "HISTORY.md"]

[tool.hatch.build.targets.sdist.force-include]
"data/tier2-reference-validation.json" = "data/tier2-reference-validation.json"
"data/ud-license-audit.json" = "data/ud-license-audit.json"

# ---------------------------------------------------------------------------
# Tooling. Pinned by PRD §12.4 — ruff, not black/flake8/isort; mypy --strict.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["python", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "PTH",           # use pathlib
    "RET",           # return simplification
    "C4",            # comprehensions
]
ignore = [
    "E501",  # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
# MorphyNet's segmentation column is quoted verbatim in both files, and the
# Mongolian rows are the load-bearing example: the gold omits a buffer consonant
# the surface form carries. Cyrillic a/e/p read as confusable with Latin, which
# is exactly the check RUF001/RUF002 exist for elsewhere -- here the confusable
# character *is* the datum, and substituting a Latin lookalike would falsify it.
"python/glotscope/morphynet.py" = ["RUF001", "RUF002"]
# `Don’t` carries a curly apostrophe against a FORM column holding the straight
# one, and that mismatch is the whole point of the test -- writing it with an
# ASCII quote would delete the thing being checked.
"tests/test_conllu.py" = ["RUF001"]
"tests/test_morphynet.py" = ["RUF001", "RUF002"]
"tests/test_morphology_wiring.py" = ["RUF001", "RUF002"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["python/glotscope", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = [
    "tokenizers.*",
    "tiktoken.*",
    "safetensors.*",
    "stanza.*",
    "jieba.*",
    "pythainlp.*",
    "fugashi.*",
    "icu.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "reference: reproduces a published reference value (PRD §12.1)",
    "property: Hypothesis property test (PRD §12.2)",
    "segmenter: requires an optional segmenter extra; skips when unavailable",
    "gated: requires HF_TOKEN or manual terms acceptance; skips when unavailable",
    "network: downloads a corpus or checkpoint",
]

# Coverage gate is 85% line coverage (G1). Kept here so CI and local runs agree.
[tool.coverage.run]
source = ["python/glotscope"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
